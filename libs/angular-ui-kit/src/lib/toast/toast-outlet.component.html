@for (position of positions; track position) {
  <div class="lc-toast-outlet__stack" [class]="'lc-toast-outlet__stack lc-toast-outlet__stack--' + position">
    <!-- Both regions are always present (even empty) so that toasts inserted
         later are announced; the toasts themselves do not announce again. -->
    @for (live of liveLevels; track live) {
      <div class="lc-toast-outlet__region" [attr.aria-live]="live" aria-atomic="false">
        @for (toast of toastsFor(position, live); track toast.id) {
          <lc-toast [toast]="toast" [announce]="false" (closed)="onClosed($event)" />
        }
      </div>
    }
  </div>
}
