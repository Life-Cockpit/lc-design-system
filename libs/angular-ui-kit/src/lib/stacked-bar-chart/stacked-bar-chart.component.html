<div class="lc-stacked-bar-chart">
  <svg
    width="100%"
    [attr.height]="height()"
    [attr.viewBox]="viewBox()"
    role="img"
    [attr.aria-label]="effectiveAriaLabel()"
    class="lc-stacked-bar-chart__svg"
  >
    <title>{{ effectiveAriaLabel() }}</title>

    @if (showGrid()) {
      @for (line of gridLines(); track line.pos) {
        @if (isVertical()) {
          <line [attr.x1]="axisLine().hx1" [attr.y1]="line.pos" [attr.x2]="axisLine().hx2" [attr.y2]="line.pos" class="lc-stacked-bar-chart__grid" />
          <text [attr.x]="axisLine().vx1 - 6" [attr.y]="line.pos" text-anchor="end" dominant-baseline="central" class="lc-stacked-bar-chart__grid-label">{{ line.label }}</text>
        } @else {
          <line [attr.x1]="line.pos" [attr.y1]="axisLine().vy1" [attr.x2]="line.pos" [attr.y2]="axisLine().vy2" class="lc-stacked-bar-chart__grid" />
          <text [attr.x]="line.pos" [attr.y]="plotBottom() + 12" text-anchor="middle" class="lc-stacked-bar-chart__grid-label">{{ line.label }}</text>
        }
      }
    }

    <line [attr.x1]="axisLine().vx1" [attr.y1]="axisLine().vy1" [attr.x2]="axisLine().vx2" [attr.y2]="axisLine().vy2" class="lc-stacked-bar-chart__axis" />
    <line [attr.x1]="axisLine().hx1" [attr.y1]="axisLine().hy1" [attr.x2]="axisLine().hx2" [attr.y2]="axisLine().hy2" class="lc-stacked-bar-chart__axis" />

    @for (stack of stacks(); track $index) {
      @for (seg of stack.segments; track $index) {
        <rect [attr.x]="seg.x" [attr.y]="seg.y" [attr.width]="seg.w" [attr.height]="seg.h" [attr.fill]="seg.color" class="lc-stacked-bar-chart__segment" />
        @if (showValues() && seg.showValue) {
          <text [attr.x]="seg.valueX" [attr.y]="seg.valueY" text-anchor="middle" dominant-baseline="central" class="lc-stacked-bar-chart__segment-value">{{ seg.valueText }}</text>
        }
      }
      @if (showValues()) {
        <text [attr.x]="stack.totalPos.x" [attr.y]="stack.totalPos.y" [attr.text-anchor]="stack.totalPos.anchor" [attr.dominant-baseline]="isVertical() ? 'auto' : 'central'" class="lc-stacked-bar-chart__total">{{ stack.totalText }}</text>
      }
      @if (showLabels()) {
        <text [attr.x]="stack.labelPos.x" [attr.y]="stack.labelPos.y" [attr.text-anchor]="isVertical() ? 'middle' : 'end'" [attr.dominant-baseline]="isVertical() ? 'auto' : 'central'" class="lc-stacked-bar-chart__label">{{ stack.label }}</text>
      }
    }
  </svg>

  @if (showLegend() && legendItems().length) {
    <div class="lc-stacked-bar-chart__legend">
      @for (item of legendItems(); track $index) {
        <div class="lc-stacked-bar-chart__legend-item">
          <span class="lc-stacked-bar-chart__legend-dot" [style.background-color]="item.color"></span>
          <span class="lc-stacked-bar-chart__legend-text">{{ item.label }}</span>
        </div>
      }
    </div>
  }
</div>
