<div [class]="hostClasses()" role="status">
  @if (icon()) {
    <lc-icon [name]="icon()!" size="xl" color="var(--color-text-tertiary)" [decorative]="true" />
  }
  @if (heading()) {
    @switch (headingLevel()) {
      @case (2) {
        <h2 class="empty-state__heading">{{ heading() }}</h2>
      }
      @case (4) {
        <h4 class="empty-state__heading">{{ heading() }}</h4>
      }
      @case (5) {
        <h5 class="empty-state__heading">{{ heading() }}</h5>
      }
      @case (6) {
        <h6 class="empty-state__heading">{{ heading() }}</h6>
      }
      @default {
        <h3 class="empty-state__heading">{{ heading() }}</h3>
      }
    }
  }
  @if (message()) {
    <p class="empty-state__message">{{ message() }}</p>
  }
  <ng-content />
</div>
