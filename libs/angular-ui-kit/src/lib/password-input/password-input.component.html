<div class="lc-password-input">
  <label [for]="inputId" class="lc-label">
    {{ label() }}
    @if (required()) {
      <span class="lc-required" aria-hidden="true">*</span>
    }
  </label>

  <div class="lc-input-wrapper">
    <input
      [id]="inputId"
      [type]="isPasswordVisible() ? 'text' : 'password'"
      [value]="value()"
      [placeholder]="placeholder()"
      [disabled]="isDisabled()"
      [required]="required()"
      [attr.aria-required]="required() || null"
      [attr.aria-invalid]="error() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (input)="onInput($event)"
      (blur)="onBlur()"
      class="lc-input"
      [class.lc-input-error]="error()"
    />

    <button
      type="button"
      (click)="togglePasswordVisibility()"
      [attr.aria-label]="isPasswordVisible() ? 'Hide password' : 'Show password'"
      [attr.aria-pressed]="isPasswordVisible()"
      [attr.aria-controls]="inputId"
      class="lc-toggle-btn"
      [disabled]="isDisabled()"
    >
      @if (isPasswordVisible()) {
        <lc-icon name="eye-slash" size="md" [decorative]="true"></lc-icon>
      } @else {
        <lc-icon name="eye" size="md" [decorative]="true"></lc-icon>
      }
    </button>
  </div>

  @if (error()) {
    <div [id]="errorId" class="lc-error" role="alert">
      {{ error() }}
    </div>
  }

  @if (showStrengthMeter()) {
    <div class="lc-strength-meter">
      <!-- The bar is decorative; the live label below carries the meaning -->
      <div class="lc-strength-bar" aria-hidden="true">
        <div class="lc-strength-fill" [class]="strengthLevelClass()" [style.width.%]="strength().percentage"></div>
      </div>
      <div [id]="strengthId" class="lc-strength-label" [class]="strengthLevelClass()" role="status" aria-live="polite">
        <span class="lc-sr-only">Password strength: </span>{{ strength().level }}
      </div>
    </div>
  }

  @if (showRequirements()) {
    <lc-alert variant="info" [dismissible]="false">
      <ul class="lc-requirements" aria-label="Password requirements">
        @for (req of requirements(); track req.label) {
          <li
            class="lc-requirement"
            [class.lc-requirement-met]="req.met"
            [class.lc-requirement-unmet]="!req.met"
          >
            <span class="lc-requirement-icon" aria-hidden="true">{{ req.icon }}</span>
            <span class="lc-requirement-label">{{ req.label }}</span>
            <span class="lc-sr-only">{{ req.met ? '(met)' : '(not met)' }}</span>
          </li>
        }
      </ul>
    </lc-alert>
  }
</div>
