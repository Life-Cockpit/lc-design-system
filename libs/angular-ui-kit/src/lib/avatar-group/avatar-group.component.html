<div [class]="groupClasses()" [style.--lc-avatar-group-overlap]="overlap() || null">
  @for (avatar of visibleAvatars(); track avatar.name ?? $index) {
    <lc-avatar
      class="avatar-group__item"
      [src]="avatar.src"
      [alt]="avatar.alt"
      [name]="avatar.name"
      [size]="size()"
      [color]="avatar.color ?? 'default'"
      [ring]="ring()"
    />
  }
  @if (overflowCount() > 0) {
    <span class="avatar-group__overflow avatar-group__overflow--{{ size() }}">
      +{{ overflowCount() }}
    </span>
  }
</div>
