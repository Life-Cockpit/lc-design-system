<svg
  width="100%"
  [attr.height]="height()"
  [attr.viewBox]="viewBox()"
  role="img"
  [attr.aria-label]="effectiveAriaLabel()"
  class="lc-bar-chart"
>
  <title>{{ effectiveAriaLabel() }}</title>

  <!-- Grid lines -->
  @if (showGrid()) {
    @for (line of gridLines(); track line.pos) {
      @if (isVertical()) {
        <line
          [attr.x1]="axisLine().bx1"
          [attr.y1]="line.pos"
          [attr.x2]="axisLine().bx2"
          [attr.y2]="line.pos"
          class="lc-bar-chart__grid-line"
        />
        <text
          [attr.x]="axisLine().x1 - 6"
          [attr.y]="line.pos"
          text-anchor="end"
          dominant-baseline="central"
          class="lc-bar-chart__grid-label"
        >
          {{ line.label }}
        </text>
      } @else {
        <line
          [attr.x1]="line.pos"
          [attr.y1]="axisLine().y1"
          [attr.x2]="line.pos"
          [attr.y2]="axisLine().y2"
          class="lc-bar-chart__grid-line"
        />
        <text
          [attr.x]="line.pos"
          [attr.y]="plotBottom() + 12"
          text-anchor="middle"
          class="lc-bar-chart__grid-label"
        >
          {{ line.label }}
        </text>
      }
    }
  }

  <!-- Axes -->
  <line
    [attr.x1]="axisLine().x1"
    [attr.y1]="axisLine().y1"
    [attr.x2]="axisLine().x2"
    [attr.y2]="axisLine().y2"
    class="lc-bar-chart__axis"
  />
  <line
    [attr.x1]="axisLine().bx1"
    [attr.y1]="axisLine().by1"
    [attr.x2]="axisLine().bx2"
    [attr.y2]="axisLine().by2"
    class="lc-bar-chart__axis"
  />

  <!-- Bars -->
  @for (bar of bars(); track $index) {
    <rect
      [attr.x]="bar.x"
      [attr.y]="bar.y"
      [attr.width]="bar.width"
      [attr.height]="bar.height"
      [attr.fill]="bar.color"
      rx="2"
      class="lc-bar-chart__bar"
    />

    @if (showValues()) {
      <text
        [attr.x]="bar.valueX"
        [attr.y]="bar.valueY"
        [attr.text-anchor]="bar.valueAnchor"
        [attr.dominant-baseline]="isVertical() ? 'auto' : 'central'"
        class="lc-bar-chart__value"
      >
        {{ bar.valueText }}
      </text>
    }

    @if (showLabels()) {
      <text
        [attr.x]="bar.labelX"
        [attr.y]="bar.labelY"
        [attr.text-anchor]="isVertical() ? 'middle' : 'end'"
        [attr.dominant-baseline]="isVertical() ? 'auto' : 'central'"
        class="lc-bar-chart__label"
      >
        {{ bar.label }}
      </text>
    }
  }
</svg>
