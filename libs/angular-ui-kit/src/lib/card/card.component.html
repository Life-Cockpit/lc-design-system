<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -- Enter/Space are handled by the host keydown listener (role=button, tabindex=0 when clickable) -->
<div
  [class]="cardClasses()"
  [attr.role]="role()"
  [attr.aria-label]="ariaLabel()"
  [attr.tabindex]="isClickable() ? 0 : null"
  (click)="handleClick($event)"
>
  @if (title()) {
    <div class="card__header">
      @if (icon()) {
        <div
          class="card__icon card__icon--{{ iconVariant() }} card__icon--size-{{ iconSize() }}"
          aria-hidden="true"
        >
          <lc-icon [name]="icon()!" [size]="iconSize() === 'sm' ? 'xs' : 'sm'" [decorative]="true" />
        </div>
      }
      <div class="card__header-left">
        <div class="card__title-row">
          @switch (headingLevel()) {
            @case (2) {
              <h2 class="card__title">{{ title() }}</h2>
            }
            @case (4) {
              <h4 class="card__title">{{ title() }}</h4>
            }
            @case (5) {
              <h5 class="card__title">{{ title() }}</h5>
            }
            @case (6) {
              <h6 class="card__title">{{ title() }}</h6>
            }
            @default {
              <h3 class="card__title">{{ title() }}</h3>
            }
          }
          <!-- Rich status badge: project an lc-badge here (takes visual
               precedence over the `badge` string). Wrapper hides when empty. -->
          <span class="card__badge-slot"><ng-content select="[card-badge]"></ng-content></span>
          @if (badge()) {
            <span class="card__badge card__badge--{{ badgeVariant() }}">{{ badge() }}</span>
          }
        </div>
        @if (subtitle()) {
          <p class="card__subtitle">{{ subtitle() }}</p>
        }
      </div>
      <div class="card__header-action">
        <ng-content select="[card-header-action]"></ng-content>
      </div>
    </div>
  }
  <ng-content select="[card-header]"></ng-content>
  <div class="card__body">
    <ng-content></ng-content>
  </div>
  <ng-content select="[card-footer]"></ng-content>
</div>
