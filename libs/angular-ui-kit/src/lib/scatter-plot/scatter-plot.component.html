<div class="lc-scatter-plot">
  <svg
    [attr.width]="width()"
    [attr.height]="height()"
    [attr.viewBox]="viewBox()"
    [attr.role]="interactive() ? 'group' : 'img'"
    [attr.aria-label]="effectiveAriaLabel()"
    class="lc-scatter-plot__svg"
  >
    <title>{{ effectiveAriaLabel() }}</title>

    <!-- Grid, axes and tick labels are decoration for AT; the summary carries the meaning. -->
    <g aria-hidden="true">
      <!-- Grid lines Y -->
      @for (line of gridLinesY(); track line.y) {
        <line
          [attr.x1]="axisLine().hx1"
          [attr.y1]="line.y"
          [attr.x2]="axisLine().hx2"
          [attr.y2]="line.y"
          class="lc-scatter-plot__grid-line"
        />
        @if (showYLabels()) {
          <text
            [attr.x]="axisLine().vx1 - 6"
            [attr.y]="line.y"
            text-anchor="end"
            dominant-baseline="central"
            class="lc-scatter-plot__label"
          >{{ line.label }}</text>
        }
      }

      <!-- Grid lines X -->
      @for (line of gridLinesX(); track line.x) {
        <line
          [attr.x1]="line.x"
          [attr.y1]="axisLine().vy1"
          [attr.x2]="line.x"
          [attr.y2]="axisLine().vy2"
          class="lc-scatter-plot__grid-line"
        />
        @if (showXLabels()) {
          <!-- Tick labels sit just under the plot; the axis title takes the last line of
               the bottom padding, so the two never overlap. -->
          <text
            [attr.x]="line.x"
            [attr.y]="plotArea().y + plotArea().h + 14"
            text-anchor="middle"
            class="lc-scatter-plot__label"
          >{{ line.label }}</text>
        }
      }

      <!-- Axes -->
      <line [attr.x1]="axisLine().vx1" [attr.y1]="axisLine().vy1" [attr.x2]="axisLine().vx2" [attr.y2]="axisLine().vy2" class="lc-scatter-plot__axis" />
      <line [attr.x1]="axisLine().hx1" [attr.y1]="axisLine().hy1" [attr.x2]="axisLine().hx2" [attr.y2]="axisLine().hy2" class="lc-scatter-plot__axis" />

      <!-- Axis labels -->
      @if (xAxisLabel()) {
        <text [attr.x]="plotArea().x + plotArea().w / 2" [attr.y]="height() - 3" text-anchor="middle" class="lc-scatter-plot__axis-label">{{ xAxisLabel() }}</text>
      }
      @if (yAxisLabel()) {
        <text [attr.x]="12" [attr.y]="plotArea().y + plotArea().h / 2" text-anchor="middle" [attr.transform]="'rotate(-90, 12, ' + (plotArea().y + plotArea().h / 2) + ')'" class="lc-scatter-plot__axis-label">{{ yAxisLabel() }}</text>
      }
    </g>

    <!-- Series dots -->
    @for (ser of renderedSeries(); track $index) {
      @for (pt of ser.points; track $index) {
        <circle
          [attr.cx]="pt.cx"
          [attr.cy]="pt.cy"
          [attr.r]="pt.r"
          [attr.fill]="ser.color"
          class="lc-scatter-plot__dot"
          [class.lc-scatter-plot__dot--interactive]="interactive()"
          [attr.tabindex]="interactive() ? 0 : null"
          [attr.role]="interactive() ? 'button' : null"
          [attr.aria-label]="interactive() ? pt.ariaLabel : null"
          (mouseenter)="onDotEnter(pt.cx, pt.cy, pt.label)"
          (mouseleave)="onDotLeave()"
          (focus)="onDotEnter(pt.cx, pt.cy, pt.label)"
          (blur)="onDotLeave()"
          (click)="onDotClick(ser.label, pt.orig)"
          (keydown.enter)="onDotClick(ser.label, pt.orig)"
          (keydown.space)="$event.preventDefault(); onDotClick(ser.label, pt.orig)"
        />
      }
    }

    <!-- Tooltip -->
    @if (hoveredPoint(); as hp) {
      <g class="lc-scatter-plot__tooltip" aria-hidden="true">
        <rect
          [attr.x]="hp.sx - hp.w / 2"
          [attr.y]="hp.ty"
          [attr.width]="hp.w"
          [attr.height]="tooltipH"
          rx="4"
          class="lc-scatter-plot__tooltip-bg"
        />
        <text
          [attr.x]="hp.sx"
          [attr.y]="hp.ty + tooltipH / 2"
          text-anchor="middle"
          dominant-baseline="central"
          class="lc-scatter-plot__tooltip-text"
        >{{ hp.label }}</text>
      </g>
    }
  </svg>

  @if (legendItems().length) {
    <div class="lc-scatter-plot__legend">
      @for (item of legendItems(); track $index) {
        <div class="lc-scatter-plot__legend-item">
          <span class="lc-scatter-plot__legend-dot" [style.background-color]="item.color"></span>
          <span class="lc-scatter-plot__legend-label">{{ item.label }}</span>
        </div>
      }
    </div>
  }
</div>
