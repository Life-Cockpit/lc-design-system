<div
  class="lc-toggle-group"
  [ngClass]="sizeClass()"
  role="radiogroup"
  [attr.aria-label]="ariaLabelledBy() ? null : ariaLabel() || null"
  [attr.aria-labelledby]="ariaLabelledBy() || null"
>
  @for (option of options(); track option.value; let i = $index) {
    <button
      #toggleBtn
      type="button"
      role="radio"
      [class]="getButtonClasses(option)"
      [disabled]="option.disabled ?? false"
      [attr.aria-checked]="isActive(option)"
      [attr.tabindex]="tabIndexFor(option)"
      (click)="select(option)"
      (keydown)="onKeydown($event, i)"
    >
      {{ option.label }}
      @if (dotTone(option); as tone) {
        <span
          class="lc-toggle-group__dot lc-toggle-group__dot--{{ tone }}"
          aria-hidden="true"
        ></span>
      }
    </button>
  }
</div>
