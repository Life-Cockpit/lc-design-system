<div class="lc-funnel-chart">
  <svg
    width="100%"
    [attr.height]="height()"
    [attr.viewBox]="viewBox()"
    role="img"
    [attr.aria-label]="effectiveAriaLabel()"
    class="lc-funnel-chart__svg"
  >
    <title>{{ effectiveAriaLabel() }}</title>

    @for (step of renderedSteps(); track $index) {
      <path
        [attr.d]="step.path"
        [attr.fill]="step.color"
        class="lc-funnel-chart__step"
      />

      @if (showLabels()) {
        <text
          [attr.x]="step.labelX"
          [attr.y]="step.labelY - 2"
          [attr.fill]="step.ink"
          text-anchor="middle"
          dominant-baseline="auto"
          class="lc-funnel-chart__label"
          [class.lc-funnel-chart__text--halo]="step.halo"
        >{{ step.label }}</text>
      }

      @if (showValues() || showPercentage()) {
        <text
          [attr.x]="step.labelX"
          [attr.y]="step.labelY + 12"
          [attr.fill]="step.ink"
          text-anchor="middle"
          dominant-baseline="auto"
          class="lc-funnel-chart__value"
          [class.lc-funnel-chart__text--halo]="step.halo"
        >
          @if (showValues()) { {{ step.valueText }} }
          @if (showValues() && showPercentage()) { · }
          @if (showPercentage()) { {{ step.pct }}% }
        </text>
      }
    }
  </svg>
</div>
