<label [attr.for]="id()" [class]="labelClasses()">
  <input
    #radioInput
    type="radio"
    [id]="id()"
    [name]="name()"
    [value]="value()"
    [checked]="checked()"
    [disabled]="isDisabled()"
    [required]="required()"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-labelledby]="ariaLabelledBy() || null"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-disabled]="isDisabled() ? 'true' : null"
    [attr.tabindex]="isDisabled() ? -1 : 0"
    role="radio"
    class="radio-input"
    (change)="handleChange($event)"
    (blur)="handleBlur()"
  />
  <span class="radio-circle">
    <span class="radio-dot"></span>
  </span>
  @if (label()) {
    <span class="radio-label-text">{{ label() }}</span>
  }
</label>

@if (helpTextId(); as helpId) {
  <div [id]="helpId" class="radio-help-text">{{ helpText() }}</div>
}

@if (errorMessageId(); as errorId) {
  <div [id]="errorId" class="radio-error-message">{{ errorMessage() }}</div>
}
