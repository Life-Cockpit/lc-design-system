@if (visible()) {
  <div [class]="containerClasses()">
    @if (showIcon()) {
      <div class="lc-alert__icon">
        <lc-icon
          [name]="defaultIcon()"
          size="md"
          [decorative]="!iconAriaLabel()"
          [ariaLabel]="iconAriaLabel()"
        />
      </div>
    }
    
    <div class="lc-alert__body">
      @if (title()) {
        <div class="lc-alert__title">{{ title() }}</div>
      }
      
      <div class="lc-alert__content">
        @if (message()) {
          {{ message() }}
        } @else {
          <ng-content />
        }
      </div>
    </div>

    <div class="lc-alert__action">
      <ng-content select="[slot='action']" />
    </div>

    @if (dismissible()) {
      <button
        type="button"
        class="lc-alert__close"
        [attr.aria-label]="closeAriaLabel()"
        (click)="onCloseClick($event)"
      >
        <lc-icon name="x-mark" size="sm" [decorative]="true" />
      </button>
    }
  </div>
}
