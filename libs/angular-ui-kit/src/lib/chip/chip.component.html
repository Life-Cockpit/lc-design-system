<!--
  Three shells, one interactive control per role — never nested:
  - clickable + removable: a <span> pill holding two sibling <button>s
    (activate / remove)
  - clickable:             the pill itself is the <button>
  - otherwise:             a static <span>; the only control is the
                           labelled remove <button> (when removable)
  The icon + label content is shared via template so all shells stay identical.
-->
<ng-template #chipContent>
  <span class="lc-chip__content">
    @if (icon()) {
      <lc-icon [name]="icon()!" class="lc-chip__icon" size="sm" [decorative]="true" />
    }
    <span class="lc-chip__label">
      <ng-content></ng-content>
    </span>
  </span>
</ng-template>

<ng-template #deleteButton>
  <button
    type="button"
    class="lc-chip__delete"
    aria-label="Remove chip"
    (click)="onRemove($event)"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>
</ng-template>

@if (clickable() && removable()) {
  <span [class]="chipClasses() + ' lc-chip--split'" [attr.aria-disabled]="disabled() ? 'true' : null">
    <button
      type="button"
      class="lc-chip__action"
      [disabled]="disabled()"
      (click)="onChipClick()"
    >
      <ng-container [ngTemplateOutlet]="chipContent" />
    </button>
    @if (!disabled()) {
      <ng-container [ngTemplateOutlet]="deleteButton" />
    }
  </span>
} @else if (clickable()) {
  <button
    type="button"
    [class]="chipClasses()"
    [disabled]="disabled()"
    [attr.aria-disabled]="disabled() ? 'true' : null"
    (click)="onChipClick()"
  >
    <ng-container [ngTemplateOutlet]="chipContent" />
  </button>
} @else {
  <span [class]="chipClasses()" [attr.aria-disabled]="disabled() ? 'true' : null">
    <ng-container [ngTemplateOutlet]="chipContent" />
    @if (removable() && !disabled()) {
      <ng-container [ngTemplateOutlet]="deleteButton" />
    }
  </span>
}
