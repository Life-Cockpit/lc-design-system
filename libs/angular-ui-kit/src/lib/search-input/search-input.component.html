<div [class]="wrapperClasses()">
  <lc-icon name="magnifying-glass" class="search-input__icon" [decorative]="true"></lc-icon>
  <input
    #searchInputEl
    type="search"
    class="search-input__field"
    [id]="inputId()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [value]="value()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    autocomplete="off"
    [attr.aria-label]="ariaLabelledBy() ? null : ariaLabel() || 'Search'"
    [attr.aria-labelledby]="ariaLabelledBy() || null"
  />
  @if (value()) {
    <button
      type="button"
      class="search-input__clear"
      (click)="clear()"
      aria-label="Clear search"
      [disabled]="disabled()"
    >
      <lc-icon name="x-mark" class="search-input__clear-icon" [decorative]="true"></lc-icon>
    </button>
  }
</div>
