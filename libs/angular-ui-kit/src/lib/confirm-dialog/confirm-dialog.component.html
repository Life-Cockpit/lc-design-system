<lc-modal
  [open]="open()"
  size="sm"
  [placement]="placement()"
  [showCloseButton]="true"
  [closeAriaLabel]="closeAriaLabel()"
  [ariaLabelledBy]="titleId"
  (openChange)="$event ? null : onModalClose()"
>
  <div slot="header">
    <div class="lc-confirm__header">
      <lc-icon
        [name]="resolvedIcon()"
        size="md"
        [color]="iconColor()"
        [decorative]="true"
      />
      <h2 [id]="titleId">{{ title() }}</h2>
    </div>
  </div>

  <div slot="body">
    <p class="lc-confirm__message">{{ message() }}</p>

    <div class="lc-confirm__preview">
      <ng-content select="[slot='preview']" />
    </div>

    @if (requireText(); as req) {
      <div class="lc-confirm__require-text">
        <!-- lc-input renders the prompt as an associated <label for> -->
        <lc-input
          [label]="req.prompt"
          [placeholder]="req.expected"
          (valueChange)="onInputChange($event)"
          (enterPressed)="onConfirm()"
        />
      </div>
    }
  </div>

  <div slot="footer" class="lc-confirm__footer">
    <lc-button
      variant="ghost"
      [size]="buttonSize()"
      (clicked)="onCancel()"
    >
      {{ cancelLabel() }}
    </lc-button>
    <lc-button
      [variant]="confirmButtonVariant()"
      [size]="buttonSize()"
      [disabled]="!confirmAllowed()"
      [loading]="confirmLoading()"
      (clicked)="onConfirm()"
    >
      {{ confirmLabel() }}
    </lc-button>
  </div>
</lc-modal>
