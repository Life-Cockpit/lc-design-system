@if (visible()) {
  <div [class]="calloutClasses()" [attr.role]="role()">
    <lc-icon
      class="callout__icon"
      [name]="iconName()"
      size="md"
      [decorative]="!iconAriaLabel()"
      [ariaLabel]="iconAriaLabel()"
    />
    <div class="callout__content">
      @if (title()) {
        <strong class="callout__title">{{ title() }}</strong>
      }
      <div class="callout__body">
        <ng-content />
      </div>
    </div>
    @if (dismissible()) {
      <button
        type="button"
        class="callout__dismiss"
        [attr.aria-label]="dismissAriaLabel()"
        (click)="dismiss()"
      >
        <lc-icon name="x-mark" size="sm" [decorative]="true" />
      </button>
    }
  </div>
}
