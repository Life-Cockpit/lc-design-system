name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # No dependency cache in release builds (npm's trusted-publishing guidance).
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: |
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || npm install -g npm@11
          npm --version

      - run: npm ci

      - name: Run tests
        run: npx nx run angular-ui-kit:test --ci

      - name: Build angular-ui-kit
        run: npx nx build angular-ui-kit --configuration=production

      - name: Verify build output
        run: |
          test -f dist/libs/angular-ui-kit/package.json || { echo "::error::dist/libs/angular-ui-kit/package.json missing"; exit 1; }
          echo "Publishing version:"
          node -p "require('./dist/libs/angular-ui-kit/package.json').version"

      # Publishes only via npm trusted publishing (OIDC, id-token: write); the trusted
      # publisher is configured on npmjs.com for Life-Cockpit/lc-design-system and this
      # workflow file. No npm token is used. Provenance is generated automatically.
      - name: Publish
        run: |
          cd dist/libs/angular-ui-kit
          set -o pipefail
          if npm publish --access public 2>&1 | tee /tmp/npm-publish.log; then
            echo "Published successfully."
          else
            status=$?
            if grep -q -E "EPUBLISHCONFLICT|cannot publish over the previously published versions|You cannot publish over the previously published versions" /tmp/npm-publish.log; then
              echo "::warning::Version already published, skipping."
              exit 0
            fi
            echo "::error::npm publish failed with exit code $status"
            exit $status
          fi
