name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # No dependency cache in release builds (npm's trusted-publishing guidance).
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: |
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || npm install -g npm@11
          npm --version

      - run: npm ci

      - name: Run tests
        run: npx nx run angular-ui-kit:test --ci

      - name: Build angular-ui-kit
        run: npx nx build angular-ui-kit --configuration=production

      - name: Verify build output
        run: |
          test -f dist/libs/angular-ui-kit/package.json || { echo "::error::dist/libs/angular-ui-kit/package.json missing"; exit 1; }
          echo "Publishing version:"
          node -p "require('./dist/libs/angular-ui-kit/package.json').version"

      # Staged publishing via npm trusted publishing (OIDC, id-token: write; no npm token).
      # The version is uploaded but stays unavailable until a maintainer approves it with
      # 2FA, so a compromised repository or CI run cannot release anything on its own.
      - name: Stage the release for approval
        run: |
          cd dist/libs/angular-ui-kit
          version=$(node -p "require('./package.json').version")
          set -o pipefail
          if npm stage publish --access public --provenance 2>&1 | tee /tmp/npm-stage.log; then
            {
              echo "### @lifecorner/angular-ui-kit@${version} is staged"
              echo ""
              echo "It is not public until approved. On a machine logged in to npm:"
              echo ""
              echo '```sh'
              echo "npm stage list @lifecorner/angular-ui-kit"
              echo "npm stage approve <stage-id>   # asks for 2FA"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            status=$?
            if grep -q -E "EPUBLISHCONFLICT|previously published|already (exists|staged)" /tmp/npm-stage.log; then
              echo "::warning::Version ${version} is already published or staged, skipping."
              exit 0
            fi
            echo "::group::OIDC lines from the npm debug log (tokens are redacted by npm)"
            grep -ih "oidc" "$HOME"/.npm/_logs/*-debug-0.log | tail -20 || true
            echo "::endgroup::"
            echo "::error::npm stage publish failed with exit code $status"
            exit $status
          fi
