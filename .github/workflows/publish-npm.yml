name: Publish to npm

# Two ways in:
# - workflow_dispatch from main with the version (the release-manager agent, after it pushed
#   the release commit): test, build and stage it, then tag the commit v<version>. A failed
#   run leaves no tag behind.
# - pushing a tag v<version> by hand: the same, without the tag job.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release; must equal libs/angular-ui-kit/package.json on main'
        required: true
        type: string

env:
  NODE_VERSION: '24'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version=$(node -p "require('./libs/angular-ui-kit/package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Releases are dispatched from main, not $GITHUB_REF"; exit 1; }
            [ "$INPUT_VERSION" = "$version" ] || { echo "::error::Input $INPUT_VERSION does not match package.json $version"; exit 1; }
            grep -q "^## \[$version\]" libs/angular-ui-kit/CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error::Tag v$version exists already"; exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # No dependency cache in release builds (npm's trusted-publishing guidance).
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: |
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || npm install -g npm@11
          npm --version

      - run: npm ci

      - name: Run tests
        run: npx nx run angular-ui-kit:test --ci

      - name: Build angular-ui-kit
        run: npx nx build angular-ui-kit --configuration=production

      - name: Verify build output
        run: |
          test -f dist/libs/angular-ui-kit/package.json || { echo "::error::dist/libs/angular-ui-kit/package.json missing"; exit 1; }
          echo "Publishing version:"
          node -p "require('./dist/libs/angular-ui-kit/package.json').version"

      # Staged publishing via npm trusted publishing (OIDC, id-token: write; no npm token).
      # The version is uploaded but stays unavailable until a maintainer approves it with
      # 2FA, so a compromised repository or CI run cannot release anything on its own.
      - name: Stage the release for approval
        run: |
          cd dist/libs/angular-ui-kit
          version=$(node -p "require('./package.json').version")
          set -o pipefail
          if npm stage publish --access public --provenance 2>&1 | tee /tmp/npm-stage.log; then
            {
              echo "### @lifecorner/angular-ui-kit@${version} is staged"
              echo ""
              echo "It is not public until approved. On a machine logged in to npm:"
              echo ""
              echo '```sh'
              echo "npm stage list @lifecorner/angular-ui-kit"
              echo "npm stage approve <stage-id>   # asks for 2FA"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            status=$?
            if grep -q -E "EPUBLISHCONFLICT|previously published|already (exists|staged)" /tmp/npm-stage.log; then
              echo "::warning::Version ${version} is already published or staged, skipping."
              exit 0
            fi
            echo "::group::OIDC lines from the npm debug log (tokens are redacted by npm)"
            grep -ih "oidc" "$HOME"/.npm/_logs/*-debug-0.log | tail -20 || true
            echo "::endgroup::"
            echo "::error::npm stage publish failed with exit code $status"
            exit $status
          fi

  # Its own job, so contents: write never runs next to npm ci and the publish token.
  # A tag pushed with GITHUB_TOKEN starts no workflow run, so this never publishes twice.
  tag:
    needs: publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag the release commit
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          subject=$(git log -1 --format=%s)
          summary=${subject#"release: $VERSION — "}
          [ "$summary" != "$subject" ] || summary="release $VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION – $summary"
          git push origin "v$VERSION"
          echo "Tagged $(git rev-parse --short HEAD) as v$VERSION" >> "$GITHUB_STEP_SUMMARY"
