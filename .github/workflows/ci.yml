name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Run tests
        run: npx nx run angular-ui-kit:test --ci

      - name: Test tools (components manifest extractor)
        run: npm run test:tools

      - name: Build angular-ui-kit library
        run: npx nx build angular-ui-kit --configuration=production

      - name: Build Storybook
        env:
          NX_DAEMON: 'false'
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: npx nx build-storybook angular-ui-kit --skipNxCache --verbose

  # The package is built with Angular 22 in partial-compilation mode, and the
  # consumer's compiler links it. The peer range claims Angular 21 and 22, so
  # every claimed release line gets a real consumer build: install the packed
  # library with strict peer resolution, AOT-compile a broad template with
  # strictTemplates, prerender it (runs the components on the server) and
  # check the HTML.
  angular-compat:
    name: Consumer app on Angular ${{ matrix.angular }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        angular: ['21.0', '21', '22.0', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Build angular-ui-kit library
        run: npx nx build angular-ui-kit --configuration=production

      - name: Build and prerender a consumer app against the packed library
        run: node tools/compat/check-angular-majors.mjs --only=${{ matrix.angular }} --work=${{ runner.temp }}/lc-compat

      # The prerendered /tt pages of that app in Chromium under life-os's
      # Trusted Types CSP (+ lc-icon), and once with lc-icon refused.
      - name: Install chrome-headless-shell
        if: matrix.angular == '22'
        run: npx -y playwright@1.64.0 install --with-deps chromium-headless-shell

      - name: Check the /tt pages under a Trusted Types CSP
        if: matrix.angular == '22'
        run: node tools/compat/check-trusted-types.mjs --app=${{ runner.temp }}/lc-compat/app-22

      # The packed entries against 3.4.1, and a fixture app that proves the
      # split (lazy routes, the name list, an app without mermaid).
      - name: Check the secondary entries and the bundle split
        if: matrix.angular == '22'
        run: node tools/compat/check-entries.mjs
